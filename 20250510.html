<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>6×6 メンバー表 – カラーフリップ</title>
  <style>
    :root {
      --hl-1: #1976d2;   /* 濃い青 */
      --hl-2: #64b5f6;   /* 水色 */
    }
    body{
      font-family:sans-serif;
      display:flex;flex-direction:column;align-items:center;
      margin:40px 0;
    }
    h1{margin-bottom:16px;font-size:1.3rem}
    #grid{border-collapse:collapse;user-select:none;-webkit-user-select:none;}
    #grid th,#grid td{
      width:110px;min-width:110px;height:50px;
      border:1px solid #bbb;text-align:center;vertical-align:middle;
      padding:4px;font-size:.85rem;transition:background-color .15s ease-out;
    }
    #grid th{background:#039be5;color:#fff;font-weight:600}
    #resetBtn{margin-top:20px;padding:10px 18px;font-size:1rem;cursor:pointer}
  </style>
</head>
<body>
  <h1>2025/5/10（土） 愛知 – 6×6 メンバー表</h1>
  <table id="grid">
    <thead>
      <tr>
        <th>1部</th><th>2部</th><th>3部</th><th>4部</th><th>5部</th><th>6部</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>今井優希</td><td>青木由帆</td><td>塩釜菜那</td><td>安納蒼衣</td><td>岩本理瑚</td><td>秋田莉杏</td></tr>
      <tr><td>岩本理瑚</td><td>今井優希</td><td>杉浦英恋</td><td>金澤亜美</td><td>杉浦英恋</td><td>伊藤ゆず</td></tr>
      <tr><td>金澤亜美</td><td>工藤唯愛</td><td>須永心海</td><td>持永真奈</td><td>萩原心花</td><td>今井優希</td></tr>
      <tr><td>西森杏弥</td><td>金澤亜美</td><td>萩原心花</td><td>八重樫美伊咲</td><td>早﨑すずき</td><td>木下藍</td></tr>
      <tr><td>早﨑すずき</td><td>杉浦英恋</td><td>長谷川稚未</td><td>八木仁愛</td><td>山口結杏</td><td>西森杏弥</td></tr>
      <tr><td>八木仁愛</td><td>須永心海</td><td>早﨑すずき</td><td>柳堀花怜</td><td>吉本此那</td><td>宮腰友里亜</td></tr>
    </tbody>
  </table>
  <button id="resetBtn">リセット</button>

  <script>
    /**
     * クリック（pointer）で名前単位に 3 段階の色ループ
     * 0 = 無色, 1 = 濃青, 2 = 水色
     * 状態は localStorage に保存
     * iOS Safari の "click" 未発火対策として pointerdown を使用
     */
    const COLORS = ["white", "var(--hl-1)", "var(--hl-2)"];  // index → color
    const STORAGE_KEY = "gridStateV4"; // バージョンアップでキー変更

    const cells = [...document.querySelectorAll("#grid tbody td")];

    // { name: 0|1|2 }
    let nameState = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    const getState = name => nameState[name] ?? 0;
    const saveState = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(nameState));

    function paint(name){
      const s = getState(name);
      const color = COLORS[s];
      cells.forEach(td => {
        if(td.textContent.trim() === name){
          td.style.backgroundColor = color;
        }
      });
    }

    function init(){
      // 全セル無色にクリアしたあと、保存済み状態を反映
      cells.forEach(td => td.style.backgroundColor = COLORS[0]);
      Object.keys(nameState).forEach(paint);
    }

    function onTap(ev){
      // Support mouse/touch/pen
      const td = ev.currentTarget;
      const name = td.textContent.trim();
      nameState[name] = (getState(name) + 1) % COLORS.length;
      paint(name);
      saveState();
    }

    // iOS Safari の click 問題回避: pointerdown で代替
    cells.forEach(td => {
      td.addEventListener("pointerdown", onTap, {passive:true});
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      nameState = {};
      cells.forEach(td => td.style.backgroundColor = COLORS[0]);
      saveState();
    });

    init();
  </script>
</body>
</html>
